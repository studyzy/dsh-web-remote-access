# dsh-web-remote-access bundle patch: remote Web access behind a --web_token gate.
# Applied after the dsh-base and dsh-web-app layers. Rows here override the
# web-app rows by id; replacements mount this bundle's forked plugins under
# new ids. The webStartup service contract is preserved (now carrying an
# optional webToken), so the web-app rows that read it keep working.

# The web-app startup row rejects --host 0.0.0.0 and knows no --web_token;
# replace it with this bundle's startup fork, which serves the same
# `webStartup` service plus `webToken`, and requires --web_token for an
# all-interfaces bind.
- id: web-startup
  disabled: true

# The stock webserver has no request gate; replace it with the forked
# implementation that provides the same ctx.webServer contract and enforces
# the token gate before route matching (covers the SPA fallback, the /api RPC
# bridge, and the WebSocket downlink).
- id: webserver
  disabled: true

# web-app's URL line prints the token-less URL; this bundle's url row prints
# the `?web_token=` variant so the printed line opens directly. The
# model-visible surface context (web-surface prompt and DSH_WEB_URL bash
# variable) stays mounted.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

- insert:
    - id: web-token-startup
      name: 'dsh-web-remote-access/startup'

    - id: webserver-gated
      name: 'dsh-web-remote-access/webserver'
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        webToken: !!js ctx.webStartup.webToken ?? ''

    - id: web-token-url
      name: 'dsh-web-remote-access/url'
      inject: [webStartup, webServer]
      config:
        printUrl: true
        webToken: !!js ctx.webStartup.webToken ?? ''

    # Insecure-origin polyfill: crypto.randomUUID is secure-context-only and
    # undefined over plain HTTP on a LAN IP; the tap injects a getRandomValues
    # fallback into the served index so client bundles (RPC ids, attachments)
    # do not throw — which also keeps the WebSocket readiness handshake alive.
    - id: web-token-polyfill
      name: 'dsh-web-remote-access/polyfill'
      inject: [webStartup, webServer]
      config:
        webToken: !!js ctx.webStartup.webToken ?? ''
