# dsh-web-remote-access bundle patch: remote Web access for `dsh web`.
# Applied after the dsh-base and dsh-web-app layers. Rows here override the
# web-app rows by id; replacements mount this bundle's plugins under new ids.
# The webStartup service contract is preserved, so the web-app rows that read
# it keep working.
#
# Remote browsers are gated by the harness's own launch-token session cookie
# (dsh 0.2.x), which the printed URL carries as `?token=`. This bundle adds no
# token of its own: it makes the remote bind reachable at all.

# The web-app startup row rejects --host 0.0.0.0 outright (wildcard binds would
# expose remote code execution to the network); replace it with this bundle's
# startup fork, which resolves the wildcard to a concrete interface address and
# serves the same `webStartup` service (now carrying `remote`).
- id: web-startup
  disabled: true

# web-app's URL line prints the composed host, which is the loopback default
# rather than the address a wildcard bind resolved to; this bundle's url row
# prints the bound address with the harness `?token=` grant. The stock browser
# handoff opens that same URL, so it stays mounted. The model-visible surface
# context (web-surface prompt and DSH_WEB_URL bash variable) stays mounted too.
- id: connection
  config:
    # Every API request and upgrade passes the loopback, listener-bind, or
    # trustedHosts policy; the session cookie lifetime is the harness default
    # (30 days) unless the invocation named one (browsers cap it at 400).
    trustedHosts: !!js ctx.webStartup.trustedHosts
    cookieMaxAgeDays: !!js ctx.webStartup.cookieMaxAgeDays ?? 30

- id: web-runtime
  config:
    openBrowser: !!js ctx.webStartup.openBrowser
    printUrl: false
    surfaceContext: true
    trustedHosts: !!js ctx.webStartup.trustedHosts

- insert:
    - id: web-remote-startup
      name: '@studyzy/dsh-web-remote-access/startup'

    - id: web-remote-url
      name: '@studyzy/dsh-web-remote-access/url'
      inject: [webStartup, webServer]
      config:
        printUrl: true

    # Insecure-origin polyfill: crypto.randomUUID is secure-context-only and
    # undefined over plain HTTP on a LAN address; the tap injects a
    # getRandomValues fallback into the served index so client bundles (RPC ids,
    # attachments) do not throw — which also keeps the WebSocket readiness
    # handshake alive. Only active on a non-loopback bind.
    - id: web-remote-polyfill
      name: '@studyzy/dsh-web-remote-access/polyfill'
      inject: [webStartup, webServer]
      config:
        remote: !!js ctx.webStartup.remote ?? false

    # DISABLED FOR DIAGNOSIS: the isLoopback override wrap correlates with the
    # documentpreview activation failure on remote binds.
    # - id: web-remote-loopback
    #   name: '@studyzy/dsh-web-remote-access/loopback'
    #   inject: [webStartup, webServer]
    #   config:
    #     remote: !!js ctx.webStartup.remote ?? false
